name: npm-security-best-practices
description: >
  Implement basic npm/pnpm/yarn/bun supply-chain hardening in the current
  repository. Merges a 14-day cooldown baseline and related security keys from
  assets into project config; supports audit, npx offline runs, and publish paths.
author: dalvarezdc
version: 1.1.0
license: MIT

compatibility:
  - grok
  - claude
  - gemini-cli
  - openai-codex
  - deepseek
  - opencode
  - cursor

trigger: >
  Load this skill to harden npm security in the current repo, or when about to
  run npm install / pnpm add / bun add / yarn add / npx; write or review .npmrc,
  pnpm-workspace.yaml, bunfig.toml, or .yarnrc.yml; review lockfiles; configure
  Dependabot, Renovate, or Snyk; publish to npm; or evaluate a new dependency.

assets:
  - path: assets/.npmrc
    description: Canonical npm baseline (ignore-scripts, allow-git=none, min-release-age=14) — merge only
  - path: assets/pnpm-workspace.yaml
    description: Canonical pnpm security keys (14-day minimumReleaseAge, trustPolicy, strictDepBuilds, blockExoticSubdeps) — merge only
  - path: assets/npx-offline-pattern.sh
    description: Parameterized offline npx helper (install | run | update)

references:
  - path: references/reference.md
    description: Full condensed reference for practices P01–P17

repository: https://github.com/dalvarezdc/npm-security-best-practices-agent
skill_path: skills/npm-security-best-practices
