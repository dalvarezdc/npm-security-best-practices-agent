# pnpm security best practices — hardened baseline (14-day cooldown)
# Canonical source for this skill. Agents must MERGE these keys into an existing
# pnpm-workspace.yaml — never overwrite packages:, catalog:, or other project keys.
# Source: https://github.com/dalvarezdc/npm-security-best-practices-agent
#
# Requires pnpm 10.16+ for minimumReleaseAge, 10.21+ for trustPolicy,
# 10.26+ for allowBuilds and blockExoticSubdeps.

# SECURITY (P03): Block packages published less than 14 days ago (20160 minutes).
minimumReleaseAge: 20160

# SECURITY (P03 opt-out): Instant upgrades for specific trusted packages only.
# Prefer narrow excludes over lowering the global gate.
# minimumReleaseAgeExclude:
#   - '@types/react'
#   - typescript

# SECURITY (P01b): Reject a package version whose publish-time trust level decreased
# (e.g. previously OIDC provenance, now without). Early account-compromise signal.
# Requires pnpm 10.21+.
trustPolicy: no-downgrade

# SECURITY (P01b opt-out): Bypass trust check for specific packages/versions when needed.
# trustPolicyExclude:
#   - 'chokidar@4.0.3'

# SECURITY (P01a): pnpm blocks install scripts by default (pnpm 10+).
# Add packages only after verifying they legitimately need native builds.
# allowBuilds replaces onlyBuiltDependencies / ignoredBuiltDependencies (pnpm 10.26+).
# allowBuilds:
#   esbuild: true

# SECURITY (P01a): Fail install if any dependency runs a build script not in allowBuilds.
# Requires pnpm 10.3+.
strictDepBuilds: true

# SECURITY (P02a): Block transitive deps from git repos or raw tarball URLs.
# Direct deps in the root package.json remain allowed. Requires pnpm 10.26+.
blockExoticSubdeps: true
